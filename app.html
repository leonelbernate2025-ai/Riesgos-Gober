<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Riesgos Institucional</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230E5B63'/%3E%3Cpath d='M16 7l8 9-8 9-8-9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16242C; --ink-2:#2C3E49; --muted:#657A86; --faint:#8FA3AD;
  --bg:#EFF3F4; --surface:#FFFFFF; --surface-2:#F7FAFA; --line:#D5DFE3;
  --accent:#0E5B63; --accent-soft:#D9EBEC; --accent-ink:#093C42;
  --z-bajo:#2E7D4F; --z-mod:#B08A16; --z-alto:#C4671A; --z-ext:#AC2A22;
  --z-bajo-bg:#E4F1E9; --z-mod-bg:#F8EFD4; --z-alto-bg:#FAE8D8; --z-ext-bg:#F8E0DE;
  --radius:3px; --shadow:0 1px 2px rgba(22,36,44,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E6EDEF; --ink-2:#C2D0D6; --muted:#8FA3AD; --faint:#6B7F89;
  --bg:#10191E; --surface:#182329; --surface-2:#1E2A31; --line:#2C3B43;
  --accent:#4FA8B0; --accent-soft:#1B3A3E; --accent-ink:#9FD4D9;
  --z-bajo:#5FB07C; --z-mod:#D4B342; --z-alto:#E0904C; --z-ext:#DF6258;
  --z-bajo-bg:#1C3527; --z-mod-bg:#38301A; --z-alto-bg:#3A2A1C; --z-ext-bg:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ink:#E6EDEF; --ink-2:#C2D0D6; --muted:#8FA3AD; --faint:#6B7F89;
  --bg:#10191E; --surface:#182329; --surface-2:#1E2A31; --line:#2C3B43;
  --accent:#4FA8B0; --accent-soft:#1B3A3E; --accent-ink:#9FD4D9;
  --z-bajo:#5FB07C; --z-mod:#D4B342; --z-alto:#E0904C; --z-ext:#DF6258;
  --z-bajo-bg:#1C3527; --z-mod-bg:#38301A; --z-alto-bg:#3A2A1C; --z-ext-bg:#3A2220;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
code,.mono,.rid{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:19px}h2{font-size:16px}h3{font-size:13px;font-weight:500;color:var(--muted)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:212px 1fr;min-height:100%}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;
  height:100vh;height:100dvh;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand-mark{display:flex;align-items:baseline;gap:7px}
.brand-mark b{font-size:15px;font-weight:600;letter-spacing:-.015em}
.brand-mark span{font-size:10px;color:var(--faint);letter-spacing:.04em}
.brand small{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.nav{padding:8px;flex:1;overflow-y:auto}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;margin-bottom:1px;
  background:none;border:0;border-radius:var(--radius);color:var(--ink-2);
  font-size:13px;text-align:left;cursor:pointer;
}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.nav button .ic{width:15px;text-align:center;opacity:.75;font-size:12px}
.nav-sep{margin:10px 9px 5px;font-size:10px;letter-spacing:.06em;color:var(--faint)}
.rail-foot{padding:10px;border-top:1px solid var(--line)}
.who{font-size:11px;color:var(--muted);margin-bottom:7px;line-height:1.35}
.who b{display:block;color:var(--ink);font-size:12px;font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap;
}
.top-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.top-t p{margin:0;font-size:12px;color:var(--muted)}
.view{padding:20px 22px 44px;max-width:1240px}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  border-radius:var(--radius);font-size:13px;cursor:pointer;
}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--z-ext);border-color:var(--z-ext)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:6px 9px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);
}
textarea{resize:vertical;min-height:62px}
input:disabled,select:disabled{background:var(--surface-2);color:var(--faint)}
.field{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>header{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card>.body{padding:15px}
.stack{display:flex;flex-direction:column;gap:16px}

table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
th{
  text-align:left;padding:8px 10px;font-size:11px;font-weight:500;color:var(--muted);
  border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;
  vertical-align:bottom;
}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
/* Texto largo justificado. No se parten palabras: la línea solo se quiebra
   cuando una palabra completa no cabe. La celda lleva ancho mínimo para que
   entren unas cinco palabras por renglón. */
.just{text-align:justify;text-justify:inter-word;
  overflow-wrap:break-word;word-break:normal;
  hyphens:manual;-webkit-hyphens:manual;-ms-hyphens:manual}
/* Las tablas con descripción usan anchos fijos por columna (colgroup):
   así el navegador no comprime la columna del riesgo. */
table.fija{table-layout:fixed}
table.fija td,table.fija th{vertical-align:top;
  overflow-wrap:break-word;word-break:normal;hyphens:manual}
table.fija td.rid{padding-top:9px}
/* Números y códigos siempre alineados entre sí */
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ctr,th.ctr{text-align:center}
td.rid{white-space:nowrap;vertical-align:top;padding-top:10px}
tbody tr:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto}

/* Bloques de texto del cuerpo, justificados */
.banner div,.empty,.kpi .d,.hint.just{text-align:justify}
.banner div{text-align:left}
.card>header h2{line-height:1.3}
.card>header{min-height:42px}
.stack>.card>header>span.tag{flex:0 0 auto}

.tag{
  display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap;
}
.zone{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:500;white-space:nowrap}
.zone.Bajo{background:var(--z-bajo-bg);color:var(--z-bajo)}
.zone.Moderado{background:var(--z-mod-bg);color:var(--z-mod)}
.zone.Alto{background:var(--z-alto-bg);color:var(--z-alto)}
.zone.Extremo{background:var(--z-ext-bg);color:var(--z-ext)}

/* ---------- heat map: the one bold element ---------- */
.heat-wrap{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:stretch}
.heat-y{display:flex;flex-direction:column-reverse;justify-content:space-around;
  font-size:11px;color:var(--muted);text-align:right;padding-bottom:22px}
.heat-y span{height:52px;display:flex;align-items:center;justify-content:flex-end}
.heat{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,52px);gap:2px}
.cell{
  position:relative;border-radius:2px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;cursor:default;
}
.cell.Bajo{background:var(--z-bajo-bg);color:var(--z-bajo)}
.cell.Moderado{background:var(--z-mod-bg);color:var(--z-mod)}
.cell.Alto{background:var(--z-alto-bg);color:var(--z-alto)}
.cell.Extremo{background:var(--z-ext-bg);color:var(--z-ext)}
.cell.empty{opacity:.32}
.cell.here{outline:2px solid var(--ink);outline-offset:-2px}
.heat-x{grid-column:2;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  font-size:11px;color:var(--muted);text-align:center;padding-top:5px}

/* ---------- charts ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:150px 1fr 34px;gap:9px;align-items:center;font-size:12px}
.bar-row .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:15px;background:var(--surface-2);border-radius:2px;overflow:hidden;display:flex}
.bar-seg{height:100%}
.bar-row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:11px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.kpi .v{font-size:27px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:11px;color:var(--muted);margin-top:3px}
.kpi .d{font-size:11px;margin-top:5px;color:var(--faint)}

/* ---------- filters ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.filters .f{min-width:138px;flex:1 1 138px;max-width:210px}
.filters label{font-size:11px;margin-bottom:3px}
.filters select{padding:5px 8px;font-size:12px}

/* ---------- misc ---------- */
.banner{padding:9px 13px;border-radius:var(--radius);font-size:12px;border:1px solid;display:flex;gap:9px;align-items:flex-start}
.banner.info{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.banner.warn{background:var(--z-alto-bg);border-color:var(--z-alto);color:var(--z-alto)}
.banner.ok{background:var(--z-bajo-bg);border-color:var(--z-bajo);color:var(--z-bajo)}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:5px;font-size:14px}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:36px 16px;overflow-y:auto;z-index:100}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  width:100%;max-width:700px;box-shadow:0 8px 32px rgba(10,20,25,.24)}
.modal>header{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal>.body{padding:17px;max-height:66vh;overflow-y:auto}
.modal>footer{padding:12px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:19px;line-height:1;padding:0 3px}

.calc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:12px}
.calc-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--line)}
.calc-row:last-child{border-bottom:0;padding-top:7px;margin-top:3px;border-top:1px solid var(--line);font-weight:500}
.calc-row .mono{color:var(--muted)}

.ctrl-item{border:1px solid var(--line);border-radius:var(--radius);padding:11px;margin-bottom:9px;background:var(--surface-2)}
.ctrl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.ctrl-head b{font-size:12px;font-weight:500}

.timeline{border-left:2px solid var(--line);margin-left:7px;padding-left:15px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;
  border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl-when{font-size:11px;color:var(--faint)}
.tl-what{font-size:13px;margin:1px 0 3px}
.diff{font-size:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px 9px;margin-top:5px}
.diff .old{color:var(--z-ext);text-decoration:line-through}
.diff .new{color:var(--z-bajo)}

.pw{background:var(--z-mod-bg);border:1px solid var(--z-mod);border-radius:var(--radius);
  padding:13px;text-align:center;margin-top:13px}
.pw .k{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;
  letter-spacing:.08em;color:var(--ink);margin:7px 0}
.pw small{font-size:11px;color:var(--z-mod)}

.hint{font-size:11px;color:var(--faint);margin-top:3px}
.req::after{content:" *";color:var(--z-ext)}

/* ---------- informe imprimible ---------- */
#informe{display:none}
.rep-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  border-bottom:2px solid #16242C;padding-bottom:9px;margin-bottom:15px}
.rep-cab h1{font-size:17px;margin:0}
.rep-cab p{margin:2px 0 0;font-size:10px;color:#555}
.rep-meta{font-size:9px;color:#555;text-align:right;line-height:1.5}
.rep-s{margin-bottom:16px}
.rep-brk{break-before:page}
.rep-h2{font-size:13px;margin:0 0 8px;padding-bottom:3px;border-bottom:1px solid #999}
.rep-h3{font-size:11px;margin:12px 0 5px;color:#333;font-weight:600}
.rep-t{width:100%;border-collapse:collapse;font-size:9px}
.rep-t th{background:#EDF1F2;border:1px solid #B9C5CA;padding:4px 5px;text-align:left;
  font-size:8.5px;font-weight:600;color:#26343C}
.rep-t td{border:1px solid #CFD9DD;padding:3px 5px;vertical-align:top}
.rep-t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rep-t tbody tr{break-inside:avoid}
.rep-tot td{background:#EDF1F2;font-weight:600}
.rep-dis td{background:#F8E0DE}
.rep-mini{max-width:430px}
.rep-sub{font-size:8px;color:#666}
.rep-n{font-size:8.5px;color:#666;margin:5px 0 0;text-align:justify}
.rep-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.rep-k{border:1px solid #B9C5CA;padding:8px 10px}
.rep-k b{display:block;font-size:20px;font-weight:400;line-height:1.1}
.rep-k span{display:block;font-size:9px;color:#444;margin-top:2px}
.rep-k i{display:block;font-size:8px;color:#777;font-style:normal;margin-top:2px}
.rep-heats{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.rep-pie{margin-top:18px;padding-top:6px;border-top:1px solid #CFD9DD;
  font-size:8px;color:#777;text-align:justify}

@media print{
  @page{size:A4 landscape;margin:11mm}
  body.modo-informe .app,body.modo-informe #modalHost{display:none!important}
  body.modo-informe #informe{display:block}
  body{background:#fff;color:#000;font-size:10px;padding:0}
  .zone,.cell,.bar-seg,.rep-t th,.rep-tot td,.rep-dis td{
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .zone{border:1px solid #999;padding:0 4px;font-size:8px}
  .heat{grid-template-rows:repeat(5,30px);gap:1px}
  .heat-y span{height:30px;font-size:8px}
  .heat-x{font-size:8px}
  .cell{font-size:11px}
  .heat-wrap{gap:5px}
  .scroll-x{overflow:visible}
  .scroll-x>table,.rep-t{min-width:0!important}
  table.fija{table-layout:auto}
  table.fija col{width:auto!important}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--line)}
  .brand{border-bottom:0;border-right:1px solid var(--line);padding:11px 13px;flex:0 0 auto}
  .brand small{display:none}
  .nav{display:flex;gap:3px;padding:7px;flex:1}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav button span:not(.ic){display:none}
  .nav-sep{display:none}
  .rail-foot{border-top:0;border-left:1px solid var(--line);flex:0 0 auto}
  .who{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .view{padding:15px}
  .top{padding:11px 15px}
  .bar-row{grid-template-columns:96px 1fr 30px}
  .heat{grid-template-rows:repeat(5,42px)}
  .heat-y span{height:42px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark"><b>Riesgos</b><span class="mono" title="Compilación del prototipo">v7 &middot; b20</span></div>
      <small>Gobernación de Santander</small>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="who"><b id="whoName">—</b><span id="whoRole"></span></div>
      <button class="btn ghost sm" id="switchUser" style="width:100%">Cambiar sesión</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top-t"><h1 id="vTitle">Panel</h1><p id="vSub"></p></div>
      <div id="vActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modalHost"></div>
<div id="informe" aria-hidden="true"></div>

<script>
/* =====================================================================
   CATÁLOGO METODOLÓGICO — Guía v7
   Espejo de las tablas de la base de datos. Ningún valor está quemado
   en la lógica: el motor de cálculo solo lee de aquí.
   ===================================================================== */
const CAT = {
  version: "GUIA_V7",

  /* Estructura organizacional SIG: macroproceso → proceso → dependencia */
  macroprocesos:[
    {c:"ESTRATEGICO", n:"Estratégicos"},
    {c:"MISIONAL", n:"Misionales"},
    {c:"APOYO", n:"Apoyo"},
    {c:"EVALUACION", n:"Evaluación"}
  ],

  procesos:[
    {c:"AC", n:"Atención al Ciudadano", m:"ESTRATEGICO"},
    {c:"DYC", n:"Dirección y Comunicaciones", m:"ESTRATEGICO"},
    {c:"GETH", n:"Gestión Estratégica del Talento Humano", m:"ESTRATEGICO"},
    {c:"PE", n:"Planificación Estratégica", m:"ESTRATEGICO"},
    {c:"SIG", n:"Sistemas Integrados de Gestión", m:"ESTRATEGICO"},
    {c:"DSC", n:"Desarrollo Sostenible y Competitivo", m:"MISIONAL"},

/* =====================================================================
   MOTOR DE CÁLCULO — solo consulta el catálogo
   ===================================================================== */
const Motor = {
  nivelProbabilidad(frec){
    return CAT.probabilidad.find(p => frec >= p.min && (p.max === null || frec <= p.max)) || null;
  },
  pesoControl(tipo, impl){
    return (CAT.pesoControl.tipo[tipo] || 0) + (CAT.pesoControl.implementacion[impl] || 0);
  },
  afectacion(tipo){ return tipo === "Correctivo" ? "Impacto" : "Probabilidad"; },
  zonaInherente(p, i){
    return CAT.matrizInherente[`${+p}|${+i}`] || null;
  },
  zonaResidual(p, i){
    const r = CAT.matrizResidual.find(r =>
      i > r.iMin && i <= r.iMax && p > r.pMin && p <= r.pMax);
    return r ? r.z : "Bajo";
  },
  /* Mitigación acumulativa: P × Π(1−peso) */
  residual(probInh, impInh, controles){
    let mp = 1, mi = 1;
    const detalle = [];
    (controles || []).forEach((c, k) => {
      const peso = this.pesoControl(c.tipo, c.implementacion);
      const af = this.afectacion(c.tipo);
      if (af === "Probabilidad"){
        const antes = probInh * mp;
        mp *= (1 - peso);
        detalle.push({n:k+1, af, peso, antes, despues: probInh * mp});
      } else {
        const antes = impInh * mi;
        mi *= (1 - peso);
        detalle.push({n:k+1, af, peso, antes, despues: impInh * mi});
      }
    });
    const p = probInh * mp, i = impInh * mi;
    return {probabilidad:p, impacto:i, multP:mp, multI:mi,
            zona:this.zonaResidual(p, i), detalle};
  },
  describir(tipoC, datos){
    const t = CAT.tiposRiesgo.find(x => x.c === tipoC);
    if (!t) return "";
    if (t.plantilla === "__INTEGRIDAD__") return this.describirIntegridad(datos);
    return t.plantilla.replace(/\{(\w+)\}/g, (_, k) => {
      const v = (datos[k] || "").toString().trim();
      return v ? (k === "areaImpacto" ? v.toLowerCase() : v) : `[${CAT.etiquetas[k] || k}]`;
    });
  },

  /* La redacción del riesgo de integridad cambia según la causa inmediata
     (Guía v7, capítulo VI). Las tres variantes están parametrizadas. */
  describirIntegridad(d){
    const ph = k => `[${CAT.etiquetas[k] || k}]`;
    const area = (d.areaIntegridad || "").trim() || ph("areaIntegridad");
    const causa = (d.causaInmediata || "").trim();
    const accion = (d.accion || "").trim() || ph("accion");

    if (!causa) return `Posibilidad de ${area} por ${ph("causaInmediata")}…`;

    if (causa === "LA/FT/FP"){
      const punto = (d.puntoRiesgo || "").trim() || ph("puntoRiesgo");
      return `Posibilidad de ${area} por usar la entidad para dar apariencia de legalidad a los `
        + `activos provenientes de actividades delictivas o para canalizar recursos hacia la `
        + `realización de actividades terroristas o la proliferación de armas de destrucción `
        + `masiva a causa de fallas u omisiones en las operaciones de ${punto}`;
    }

    if (causa === "Inadecuada gestión del conflicto de intereses"){
      return `Posibilidad de ${area} por ${causa} a causa de decidir en un asunto sobre el cual `
        + `el servidor tiene un interés particular y directo en su regulación, gestión, control `
        + `o decisión en la ${accion}`;
    }

    const def = CAT.definicionCausa[causa] || ph("definición de la causa");
    return `Posibilidad de ${area} por ${causa} en la/el ${accion} a causa de ${def}`;
  },
  /* Devuelve la política de apetito aplicable a una zona residual */
  apetito(zona){
    return CAT.apetito.find(a => a.zonas.includes(zona)) || null;
  },
  opcionesTratamiento(zona){
    const a = this.apetito(zona);
    return a ? a.opciones : CAT.tratamiento.map(t => t.c);
  },

  validarTratamiento(opcion, tipoRiesgoC, zonaResidual, subestrategia, acta){
    const o = CAT.tratamiento.find(t => t.c === opcion);
    if (!o) return "Opción de tratamiento no válida en esta versión.";
    if (zonaResidual && !this.opcionesTratamiento(zonaResidual).includes(opcion))
      return `El apetito de riesgo no admite «${opcion}» en zona ${zonaResidual}.`;
    if (o.excluye.includes(tipoRiesgoC))
      return `El tratamiento «${opcion}» no aplica a este tipo de riesgo.`;
    if (o.zonas && zonaResidual && !o.zonas.includes(zonaResidual) && !acta)
      return `«${opcion}» en zona ${zonaResidual} requiere acta de comité.`;
    if (o.exigeSub && !subestrategia)
      return `«${opcion}» exige especificar la subestrategia.`;
    return null;
  }
};

const Store = {
  db:null, local:{},
  async init(){
    try { this.db = await window.claude?.use?.("db") || null; } catch(e){ this.db = null; }
    if (!this.db){
      try { this.local = JSON.parse(localStorage.getItem("mriesgos") || "{}"); } catch(e){ this.local = {}; }
    }
  },
  async get(col){
    if (this.db){
      try { const s = await this.db.collection(col).get(); return s.map(d => ({id:d.id, ...d.data})); }
      catch(e){ return []; }
    }
    return Object.values(this.local[col] || {});
  },
  async set(col, id, data){
    if (this.db){
      try { await this.db.doc(`${col}/${id}`).set(data); return; } catch(e){}
    }
    this.local[col] = this.local[col] || {};
    this.local[col][id] = {id, ...data};
    this.flush();
  },
  async del(col, id){
    if (this.db){ try { await this.db.doc(`${col}/${id}`).delete(); return; } catch(e){} }
    if (this.local[col]) delete this.local[col][id];
    this.flush();
  },
  flush(){ try { localStorage.setItem("mriesgos", JSON.stringify(this.local)); } catch(e){} }
};

/* Evalúa el resultado del indicador contra los umbrales definidos en el
   riesgo y devuelve el nivel, su color y el texto formateado. */
function evaluarKRI(r, num, den){
  const nu = parseFloat(num), de = parseFloat(den);
  if (!isFinite(nu) || !isFinite(de) || de === 0) return null;
  const esPct = r.kriUnidad === "Porcentaje";
  const valor = esPct ? (nu / de) * 100 : nu / de;
  const texto = esPct ? valor.toFixed(1).replace(/\.0$/, "") + "%"
                      : (Number.isInteger(valor) ? String(valor) : valor.toFixed(2));

  const crit = parseFloat(r.kriCritico), sat = parseFloat(r.kriSatisfactorio);
  const aMin = parseFloat(r.kriAceptableMin), aMax = parseFloat(r.kriAceptableMax);
  const crece = r.kriTendencia === "Creciente";
  let nivel = null;

  if (isFinite(crit) && (crece ? valor < crit : valor > crit)) nivel = "Crítico";
  else if (isFinite(sat) && (crece ? valor > sat : valor < sat)) nivel = "Satisfactorio";
  else if (isFinite(aMin) && isFinite(aMax)
           && valor >= Math.min(aMin, aMax) && valor <= Math.max(aMin, aMax)) nivel = "Aceptable";

  const zona = nivel === "Crítico" ? "Extremo"
             : nivel === "Aceptable" ? "Moderado"
             : nivel === "Satisfactorio" ? "Bajo" : "";
  return {valor, texto, nivel, zona};
}

/* Calificación del diseño del control a partir de los 7 criterios */
function calificarDiseno(resp){
  let total = 0;
  CAT.evaluacionControl.forEach(cr => {
    const op = cr.op.find(o => o[0] === resp[cr.c]);
    if (op) total += op[1];
  });
  total = Math.round(total * 1e4) / 1e4;
  const r = CAT.rangoDiseno.find(x => total >= x.min && total <= x.max);
  return {total, calificacion: r ? r.n : "Débil"};
}

/* Tipo oración: mayúscula inicial y el resto en minúscula, respetando

function tipoOracion(t){

}

async function registrarVersion(riesgo, operacion, motivo, previo){
  const cambios = [];
  if (previo){
    const campos = {codigo:"Código", descripcion:"Descripción", tipo:"Tipo de riesgo",
      causaRaiz:"Causa raíz", efectoInmediato:"Efecto inmediato", areaImpacto:"Área de impacto",
      macroproceso:"Macroproceso", proceso:"Proceso", unidad:"Dependencia", frecuencia:"Frecuencia anual",
      impactoNivel:"Nivel de impacto", estado:"Estado"};
    Object.entries(campos).forEach(([k, et]) => {
      if ((previo[k] ?? "") !== (riesgo[k] ?? ""))
        cambios.push({campo:et, antes:previo[k] ?? "—", ahora:riesgo[k] ?? "—"});
    });
    const ca = (previo.controles || []).length, cb = (riesgo.controles || []).length;
    if (ca !== cb) cambios.push({campo:"Número de controles", antes:ca, ahora:cb});
  }
  const v = {
    id: uid(), riesgoId: riesgo.id, version: (S.historico.filter(h => h.riesgoId === riesgo.id).length) + 1,
    operacion, motivo: motivo || "", cambios,
    snapshot: JSON.parse(JSON.stringify(riesgo)),
    usuario: S.sesion?.nombre || "—", rol: S.sesion?.rol || "—",
    fecha: new Date().toISOString()
  };
  S.historico.push(v);
  await Store.set("historico", v.id, v);
}

const ORDEN_MACRO = {ESTRATEGICO:1, MISIONAL:2, APOYO:3, EVALUACION:4};
function ordenarRiesgos(rs){
  return [...rs].sort((a, b) => {
    const ma = ORDEN_MACRO[proc(a.proceso)?.m] || 9, mb = ORDEN_MACRO[proc(b.proceso)?.m] || 9;
    if (ma !== mb) return ma - mb;
    const pa = proc(a.proceso)?.n || "", pb = proc(b.proceso)?.n || "";
    if (pa !== pb) return pa.localeCompare(pb, "es");
    const ua = uni(a.unidad)?.n || "", ub = uni(b.unidad)?.n || "";
    if (ua !== ub) return ua.localeCompare(ub, "es");
    return (a.codigo || "").localeCompare(b.codigo || "", "es", {numeric:true});
  });
}

function riesgosFiltrados(){
  const f = S.filtros;
  return ordenarRiesgos(S.riesgos.filter(r => {
    if (r.estado === "OBSOLETO") return false;
    if (f.macroproceso && proc(r.proceso)?.m !== f.macroproceso) return false;
    if (f.proceso && r.proceso !== f.proceso) return false;
    if (f.unidad && r.unidad !== f.unidad) return false;
    if (f.tipo && r.tipo !== f.tipo) return false;
    if (f.zona && r.zonaResidual !== f.zona) return false;
    return true;
  }));
}

function agrupar(rs, keyFn, nameFn){
  const m = new Map();
  rs.forEach(r => {
    const k = keyFn(r); if (k == null) return;
    if (!m.has(k)) m.set(k, {nombre:nameFn(k), total:0, Bajo:0, Moderado:0, Alto:0, Extremo:0});
    const g = m.get(k); g.total++; if (r.zonaResidual) g[r.zonaResidual]++;
  });
  return [...m.values()].sort((a, b) => b.total - a.total);
}

function vistaPanel(){
  const rs = riesgosFiltrados();
  const n = rs.length;
  const crit = rs.filter(r => ["Alto","Extremo"].includes(r.zonaResidual)).length;
  const ord = {Bajo:1, Moderado:2, Alto:3, Extremo:4};
  const bajaron = rs.filter(r => ord[r.zonaResidual] < ord[r.zonaInherente]).length;

/* =====================================================================
   VISTA: MAPA DE CALOR
   ===================================================================== */
function mapaCalor(rs, modo){
  const probs = CAT.probabilidad.map(p => p.pct);
  const imps = CAT.impacto.map(i => i.pct);
  const conteo = {};
  rs.forEach(r => {
    const p = modo === "inh" ? r.probabilidadPct : r.probResidual;
    const i = modo === "inh" ? r.impactoPct : r.impResidual;
    if (p == null || i == null) return;
    const pp = probs.reduce((a, b) => Math.abs(b - p) < Math.abs(a - p) ? b : a);
    const ii = imps.reduce((a, b) => Math.abs(b - i) < Math.abs(a - i) ? b : a);
    const k = `${pp}|${ii}`; conteo[k] = (conteo[k] || 0) + 1;
  });
  let cells = "";
  [...imps].reverse().forEach(i => probs.forEach(p => {
    const k = `${p}|${i}`, z = CAT.matrizInherente[`${+p}|${+i}`], c = conteo[k] || 0;
    cells += `<div class="cell ${z} ${c ? "" : "empty"}" title="${z} · Probabilidad ${pct(p)} · Impacto ${pct(i)}">${c || ""}</div>`;
  }));
  return `<div class="heat-wrap">
    <div class="heat-y">${CAT.impacto.map(i => `<span>${i.n}</span>`).join("")}</div>
    <div class="heat">${cells}</div>
    <div class="heat-x">${CAT.probabilidad.map(p => `<span>${p.n}</span>`).join("")}</div>
  </div>`;
}

function vistaMatriz(){
  const rs = riesgosFiltrados();

      <div class="body">${mapaCalor(rs, "inh")}
        <p class="hint" style="margin-top:12px">El eje vertical es el impacto; el horizontal, la probabilidad.
        Con impacto Mayor o Catastrófico la zona es Alto o Extremo sin importar la probabilidad.</p></div></div>
    <div class="card"><header><h2>Riesgo residual</h2><span class="tag">Después de controles</span></header>
      <div class="body">${mapaCalor(rs, "res")}

    estado:"VIGENTE", motivo:""
  };
  F._nuevo = !existente;

}

function recalcular(){
  const np = F.frecuencia !== "" ? Motor.nivelProbabilidad(Number(F.frecuencia)) : null;

  /* Cuando el área de impacto comprende lo económico y lo reputacional se
     valoran ambas y se toma la más alta (Guía v7, numeral 3.6). */
  const area = (F.areaImpacto || F.areaIntegridad || "").toLowerCase();
  F._pideEco = !F.areaFiscal ? area.includes("econ") : true;
  F._pideRep = area.includes("reputacion");
  if (!F._pideEco && !F._pideRep){ F._pideEco = true; F._pideRep = true; }

  const nEco = CAT.impacto.find(i => i.n === F.impactoEconomico) || null;
  const nRep = CAT.impacto.find(i => i.n === F.impactoReputacional) || null;
  const candidatos = [];
  if (F._pideEco && nEco) candidatos.push(nEco);
  if (F._pideRep && nRep) candidatos.push(nRep);
  const ni = candidatos.length
    ? candidatos.reduce((a, b) => b.pct > a.pct ? b : a)
    : null;
  F.impactoNivel = ni ? ni.n : "";
  F._impactoOrigen = ni ? (ni === nEco && ni === nRep ? "ambas"
    : ni === nEco ? "económica" : "reputacional") : "";
  F.probabilidadPct = np ? np.pct : null;
  F.probabilidadNivel = np ? np.n : null;
  F.impactoPct = ni ? ni.pct : null;
  F.zonaInherente = (np && ni) ? Motor.zonaInherente(np.pct, ni.pct) : null;
  if (np && ni){
    const res = Motor.residual(np.pct, ni.pct, F.controles);
    F.probResidual = res.probabilidad; F.impResidual = res.impacto;
    F.zonaResidual = res.zona; F._detalle = res.detalle;
    F._multP = res.multP; F._multI = res.multI;
  } else { F.probResidual = F.impResidual = F.zonaResidual = null; F._detalle = []; }
  F.descripcion = tipoOracion(Motor.describir(F.tipo, F));
}

function enlazarFormulario(){
  const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e[ev] = fn; };
  const bind = (id, key, refresca) => on(id, "onchange", e => {
    F[key] = e.target.value;
    if (refresca) pintarFormulario(); else { recalcular(); pintarFormulario(); }
  });

  on("fMacro", "onchange", e => {
    F.macroproceso = e.target.value; F.proceso = ""; F.unidad = ""; F.dependencia = ""; pintarFormulario(); });
  on("fProc", "onchange", e => {
    F.proceso = e.target.value; F.unidad = ""; F.dependencia = ""; pintarFormulario(); });
  on("fUni", "onchange", e => { F.unidad = e.target.value; pintarFormulario(); });
  on("fTipo", "onchange", e => { F.tipo = e.target.value; pintarFormulario(); });
  bind("fClase", "clase");
  bind("fArea", "areaImpacto"); bind("fAreaF", "areaFiscal");
  bind("fTipoAct", "tipoActivo"); bind("fProp", "propiedadSD");
  bind("fVul", "vulnerabilidad"); bind("fAme", "amenaza");
  bind("fAreaInt", "areaIntegridad"); bind("fFactorL", "factorLAFT");
  bind("fPunto", "puntoRiesgo");
  /* Cambiar la causa inmediata habilita o esconde factor y punto de riesgo */
  on("fCausaInm", "onchange", e => {
    F.causaInmediata = e.target.value;
    if (F.causaInmediata !== "LA/FT/FP"){ F.factorLAFT = ""; F.puntoRiesgo = ""; }
    pintarFormulario();
  });
  bind("fImpEco", "impactoEconomico"); bind("fImpRep", "impactoReputacional");
  bind("fTrat", "tratamiento"); bind("fSub", "subestrategia");
  bind("kUni", "kriUnidad"); bind("kDisp", "kriDisponibilidad");
  bind("kFrec", "kriFrecuencia"); bind("kTend", "kriTendencia");

  ["fActivo:activo","fAccion:accion","fEfecto:efectoInmediato","fCausa:causaRaiz",
   "fFrec:frecuencia"].forEach(pair => {
    const [id, key] = pair.split(":");
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = () => { F[key] = el.value; };
    el.onblur  = () => { pintarFormulario(); };
  });
  ["fRG16:enlaceRG16","kNom:kriNombre","kDes:kriDescripcion","kObj:kriObjetivo","kNum:kriNumerador",
   "kDen:kriDenominador","kResp:kriResponsable","kUbi:kriUbicacion",
   "kCrit:kriCritico","kAcepMin:kriAceptableMin","kAcepMax:kriAceptableMax",
   "kSat:kriSatisfactorio","fMotivo:motivo"].forEach(pair => {
    const [id, key] = pair.split(":");
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = () => { F[key] = el.value; };
    if (id === "kNum" || id === "kDen") el.onblur = () => pintarFormulario();
  });

  /* Plan de implementación de controles: lista variable de actividades */
  const btnAct = document.getElementById("addAct");
  if (btnAct) btnAct.onclick = () => {
    F.plan = F.plan || [];
    F.plan.push({actividad:"", responsable:"", fecha:""});
    pintarFormulario();
  };
  document.querySelectorAll("[data-delact]").forEach(b => b.onclick = () => {
    F.plan.splice(Number(b.dataset.delact), 1); pintarFormulario();
  });
  document.querySelectorAll("[data-a]").forEach(el => {
    const k = Number(el.dataset.a), f = el.dataset.af;
    el.oninput = () => { F.plan[k][f] = el.value; };
    if (el.type === "date") el.onchange = () => { F.plan[k][f] = el.value; };
  });

  document.querySelectorAll("[data-fac]").forEach(cb => cb.onchange = () => {
    F.factores = F.factores || [];
    const v = cb.dataset.fac;
    F.factores = cb.checked ? [...F.factores, v] : F.factores.filter(x => x !== v);
    pintarFormulario();
  });

  on("addCtrl", "onclick", () => {
    F.controles = F.controles || [];
    F.controles.push({responsable:"", accion:"", periodicidad:"", complemento:"",
      tipo:"Preventivo", implementacion:"Manual"});
    pintarFormulario();
  });
  document.querySelectorAll("[data-delctrl]").forEach(b => b.onclick = () => {
    F.controles.splice(Number(b.dataset.delctrl), 1); pintarFormulario();
  });
  document.querySelectorAll("[data-c]").forEach(el => {
    const k = Number(el.dataset.c), f = el.dataset.f;
    if (el.tagName === "SELECT") el.onchange = () => { F.controles[k][f] = el.value; pintarFormulario(); };
    else { el.oninput = () => { F.controles[k][f] = el.value; };
           el.onblur = () => pintarFormulario(); }
  });
}

async function guardarRiesgo(){
  const falta = [];
  if (!F.macroproceso) falta.push("macroproceso");
  if (!F.proceso) falta.push("proceso");
  if (!F.unidad) falta.push("dependencia");
  if (F.frecuencia === "") falta.push("frecuencia anual");
  if (F._pideEco && !F.impactoEconomico) falta.push("afectación económica");
  if (F._pideRep && !F.impactoReputacional) falta.push("afectación reputacional");
  if (!F.tratamiento) falta.push("tratamiento");
  tipo(F.tipo).campos.forEach(c => {
    if (c === "factores") return;                       // opcional
    if ((c === "factorLAFT" || c === "puntoRiesgo")
        && F.causaInmediata !== "LA/FT/FP") return;     // solo para LA/FT/FP
    if (c === "accion" && F.tipo === "INT"
        && F.causaInmediata === "LA/FT/FP") return;     // no aplica a LA/FT/FP
    if (!F[c]) falta.push((CAT.etiquetas[c] || c).toLowerCase());
  });
  if (falta.length) return aviso("Faltan datos", `Completa: ${falta.join(", ")}.`);

  const err = Motor.validarTratamiento(F.tratamiento, F.tipo, F.zonaResidual, F.subestrategia, F.acta);
  if (err) return aviso("Tratamiento no válido", err);

  if (F.tratamiento && F.tratamiento !== "Aceptar" && !(F.plan || []).length)
    return aviso("Falta el plan de implementación",
      `El tratamiento «${F.tratamiento}» exige al menos una actividad en el plan de implementación de controles.`);

  const previo = S.riesgos.find(r => r.id === F.id);
  const necesitaAval = requiereAprobacion();

  if ((previo || necesitaAval) && (!F.motivo || F.motivo.trim().length < 20))
    return aviso("Falta el motivo",
      "Explique en al menos 20 caracteres por qué registra este cambio. Queda en el histórico y lo revisa SIG.");

  if (necesitaAval && !(F.enlaceRG16 || "").trim())
    return aviso("Falta el formato ES-SIG-RG-16",
      "Adjunte el enlace del formato diligenciado que respalda la solicitud.");

  if (necesitaAval && solicitudPendiente(F.id))
    return aviso("Ya hay una solicitud en curso",
      "Este riesgo tiene una solicitud esperando aprobación. Espere la respuesta de SIG antes de enviar otra.");

  recalcular();
  /* Fórmula legible que consumen el reporte de ejecución y los informes */
  F.kri = F.kriNumerador && F.kriDenominador
    ? `(${F.kriNumerador} / ${F.kriDenominador})${F.kriUnidad === "Porcentaje" ? " × 100" : ""}`
    : (F.kri || "");
  F.planAccion = (F.plan || []).map((a, i) =>
    `${i + 1}. ${a.actividad}${a.responsable ? ` — ${a.responsable}` : ""}${a.fecha ? ` (${a.fecha})` : ""}`)
    .join("\n") || F.planAccion || "";
  F.fechaPlan = (F.plan || []).map(a => a.fecha).filter(Boolean).sort().pop() || F.fechaPlan || "";
  F.responsablePlan = (F.plan || [])[0]?.responsable || F.responsablePlan || "";
  if (F._nuevo){
    const n = S.riesgos.filter(r => r.proceso === F.proceso && r.unidad === F.unidad).length + 1;
    F.codigo = `${F.unidad}-${String(n).padStart(2, "0")}`;
    F.fechaCreacion = new Date().toISOString().slice(0, 10);
  }
  F.fechaActualizacion = new Date().toISOString().slice(0, 10);
  const previoCopia = previo ? JSON.parse(JSON.stringify(previo)) : null;
  const nuevo = JSON.parse(JSON.stringify(F));
  ["_nuevo","_detalle","_pideEco","_pideRep","_impactoOrigen","_multP","_multI"]
    .forEach(k => delete nuevo[k]);

  if (necesitaAval){
    await crearSolicitud(previoCopia ? "ACTUALIZACION" : "CREACION",
      nuevo, previoCopia, F.motivo, F.enlaceRG16);
    cerrarModal(); F = null;
    S.vista = "solicitudes"; render();
    return aviso("Solicitud enviada",
      "La Dirección SIG debe aprobarla para que el cambio se refleje en la matriz general. "
      + "Puede seguir su estado en Ciclo semestral, Actualización de riesgos.");
  }

  const ix = S.riesgos.findIndex(r => r.id === F.id);
  if (ix >= 0) S.riesgos[ix] = nuevo; else S.riesgos.push(nuevo);
  await Store.set("riesgos", nuevo.id, nuevo);
  await registrarVersion(nuevo, previoCopia ? "ACTUALIZACION" : "CREACION", F.motivo, previoCopia);

  cerrarModal(); F = null; render();
}

function verRiesgo(id){
  const r = S.riesgos.find(x => x.id === id); if (!r) return;
  const res = Motor.residual(r.probabilidadPct, r.impactoPct, r.controles);
  const hist = S.historico.filter(h => h.riesgoId === id).sort((a, b) => b.version - a.version);
  modal(r.codigo, `
    <p class="just" style="font-size:15px;line-height:1.6;margin:0 0 15px">${esc(r.descripcion)}</p>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px">
      <span class="tag">${esc(tipo(r.tipo)?.n)}</span>

function eliminarRiesgo(id){
  const r = S.riesgos.find(x => x.id === id); if (!r) return;
  const aval = requiereAprobacion();
  if (aval && solicitudPendiente(id))
    return aviso("Ya hay una solicitud en curso",
      "Este riesgo tiene una solicitud esperando aprobación de SIG.");

  modal(aval ? "Solicitar la eliminación del riesgo" : "Eliminar riesgo", `
    <div class="banner warn"><span>&#9888;</span><div>El riesgo <b class="rid">${esc(r.codigo)}</b>
      no se borra: se marca como obsoleto y deja de aparecer en el inventario.
      Su histórico se conserva y puede restaurarse.</div></div>
    ${aval ? `<div class="banner info" style="margin-top:9px"><span>&#9432;</span><div>
      La eliminación se hará efectiva cuando la Dirección SIG apruebe la solicitud.</div></div>` : ""}
    <div class="field" style="margin-top:15px"><label class="req">Motivo de la eliminación</label>
      <textarea id="delMotivo" placeholder="Explique por qué se elimina (mínimo 20 caracteres)"></textarea></div>
    ${aval ? `<div class="field"><label class="req">Enlace al formato ES-SIG-RG-16</label>
      <input type="text" id="delRG16" placeholder="https://santandergov-my.sharepoint.com/...">
      <p class="hint">Soporte de la solicitud de eliminación.</p></div>` : ""}
  `, [
    {t:"Cancelar", cls:"ghost", fn: cerrarModal},
    {t: aval ? "Enviar solicitud" : "Eliminar", cls: aval ? "" : "danger", fn: async () => {
      const m = document.getElementById("delMotivo").value.trim();
      if (m.length < 20) return aviso("Falta el motivo", "Escriba al menos 20 caracteres.");
      if (aval){
        const link = document.getElementById("delRG16").value.trim();
        if (!link) return aviso("Falta el formato ES-SIG-RG-16",
          "Adjunte el enlace del formato que respalda la solicitud.");
        await crearSolicitud("ELIMINACION", r, r, m, link);
        cerrarModal(); S.vista = "solicitudes"; render();
        return aviso("Solicitud enviada",
          "La Dirección SIG debe aprobarla para que el riesgo salga de la matriz general.");
      }
      r.estado = "OBSOLETO"; r.eliminadoEn = new Date().toISOString();
      r.eliminadoPor = S.sesion?.nombre; r.motivoEliminacion = m;
      await Store.set("riesgos", r.id, r);
      await registrarVersion(r, "ELIMINACION", m, null);
      cerrarModal(); render();
    }}
  ]);
}

function generarClave(){
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ", b = "abcdefghijkmnopqrstuvwxyz",
        n = "23456789", s = "!@#$%&*";
  const pick = x => x[Math.floor(Math.random() * x.length)];
  let p = [pick(a), pick(a), pick(b), pick(b), pick(b), pick(n), pick(n), pick(n), pick(s), pick(s)];
  for (let i = p.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p.join("");
}

              : {id:uid(), nombre:"", correo:"", rol:"ENLACE_SIG", procesos:[], activo:true};
  modal(u ? "Editar usuario" : "Nuevo usuario", `

      <div style="max-height:250px;overflow-y:auto;border:1px solid var(--line);
        border-radius:var(--radius);padding:9px">
        ${CAT.macroprocesos.map(m => `
          <div style="margin-bottom:9px">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
              <b style="font-size:11px;color:var(--muted);letter-spacing:.03em">${esc(m.n).toUpperCase()}</b>
              <button type="button" class="btn ghost sm" data-todos="${m.c}">Todos</button>
            </div>
            ${CAT.procesos.filter(pp => pp.m === m.c).map(pp => `
              <label style="display:flex;align-items:center;gap:7px;margin:0 0 3px;

          </div>`).join("")}
      </div>
      <p class="hint" id="uConteo">${d.procesos.length} procesos seleccionados ·
        ${S.riesgos.filter(r => d.procesos.includes(r.proceso) && r.estado !== "OBSOLETO").length} riesgos a cargo</p>

    ${u ? `<p class="hint">Desactivar un usuario conserva el histórico de sus acciones; eliminarlo no.</p>` : ""}

        return aviso("Correo no válido", "Escribe una dirección de correo completa.");
      if (S.usuarios.some(x => x.correo === d.correo && x.id !== d.id))
        return aviso("Correo repetido", "Ya existe un usuario con ese correo.");

  });

/* =====================================================================
   EVIDENCIAS
   El archivo se envía a un Web App de Google Apps Script publicado por la
   entidad, que lo guarda en el Drive institucional con el nombre acordado.
   Si no hay punto de recepción configurado, queda registrado el nombre y
   el archivo se conserva en el navegador hasta que se configure.
   ===================================================================== */
function driveURL(){ try { return localStorage.getItem("driveURL") || ""; } catch(e){ return ""; } }
function setDriveURL(v){ try { localStorage.setItem("driveURL", v || ""); } catch(e){} }

function leerArchivo(file){
  return new Promise((ok, err) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result.split(",")[1]);
    fr.onerror = () => err(new Error("No se pudo leer el archivo"));
    fr.readAsDataURL(file);
  });
}

async function subirEvidencia(file, riesgo, periodo, tipo){
  const url = driveURL();
  const base64 = await leerArchivo(file);
  const ruta = rutaEvidencia(riesgo, periodo, file.name);
  if (!url){
    return {ok:false, motivo:"sin_configurar", nombre:ruta.archivo,
            carpeta:ruta.carpeta, tam:file.size};
  }
  /* text/plain evita la petición previa de CORS, que Apps Script no atiende */
  const r = await fetch(url, {
    method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({
      periodo, proceso: riesgo.proceso, dependencia: riesgo.unidad,
      codigoRiesgo: riesgo.codigo, tipo,
      nombreOriginal: file.name, mime: file.type || "application/octet-stream",
      contenido: base64
    })
  });
  const d = await r.json();
  if (!d || d.error) throw new Error(d?.error || "Respuesta inesperada del servidor");
  return {ok:true, ...d};
}

/* =====================================================================
   EXPORTACIÓN
   ===================================================================== */
function descargar(nombre, contenido, mime){
  const blob = new Blob(["\ufeff" + contenido], {type: mime + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* CSV con punto y coma: es lo que Excel en español abre sin pedir importación */
function aCSV(cabeceras, filas){
  const q = v => {
    const t = (v ?? "").toString().replace(/"/g, '""').replace(/\r?\n/g, " ");
    return /[";]/.test(t) ? `"${t}"` : t;
  };
  return [cabeceras.map(q).join(";"), ...filas.map(f => f.map(q).join(";"))].join("\r\n");
}

function sufijoFiltros(){
  const f = S.filtros, p = [];
  if (f.macroproceso) p.push(macro(f.macroproceso)?.n);
  if (f.proceso) p.push(proc(f.proceso)?.n);
  if (f.unidad) p.push(uni(f.unidad)?.n);
  if (f.tipo) p.push(tipo(f.tipo)?.n);
  if (f.zona) p.push("Zona " + f.zona);
  return p.length ? " (" + p.join(", ") + ")" : "";
}

function exportarRiesgosCSV(){
  const rs = riesgosFiltrados();
  if (!rs.length) return aviso("Nada que exportar", "No hay riesgos con los filtros aplicados.");

  /* Cuántas columnas de control hace falta: tantas como el riesgo con más
     controles, para que ninguna información quede fuera del archivo. */
  const maxC = Math.max(1, ...rs.map(r => (r.controles || []).length));
  const cabC = [];
  for (let k = 1; k <= maxC; k++)
    cabC.push(`Control ${k}`, `Tipo ${k}`, `Implementación ${k}`, `Peso ${k}`,
              `Afectación ${k}`, `Documentación ${k}`, `Frecuencia ${k}`, `Evidencia ${k}`,
              `Diseño ${k}`);

  const cab = ["Identificador","Macroproceso","Proceso","Dependencia",
    "Tipo de riesgo","Clase de riesgo","Factores","Descripción del riesgo",
    "Causa raíz","Efecto inmediato","Área de impacto","Activo","Propiedad afectada",
    "Frecuencia anual","Probabilidad inherente","Impacto inherente","Zona inherente",
    "Nº de controles", ...cabC,
    "Multiplicador probabilidad","Multiplicador impacto",
    "Probabilidad residual","Impacto residual","Zona residual",
    "Tratamiento","Subestrategia","Plan de acción","Responsable del plan","Indicador (KRI)",
    "Fecha de cumplimiento",
    "Periodo","Resultado del indicador","Actividades ejecutadas","Soporte de ejecución",
    "Estado de la acción",
    "Monitoreo: descripción conforme","Monitoreo: control conforme","Monitoreo: control eficaz",
    "Monitoreo: se materializó","Monitoreo: instancia","Monitoreo: recomendaciones",
    "CI: actividades verificadas","CI: se materializó","CI: justificación",
    "CI: acciones correctivas","CI: soporte",
    "Estado del riesgo","Pendientes de revisión"];

  const filas = rs.map(r => {
    const res = Motor.residual(r.probabilidadPct || 0, r.impactoPct || 0, r.controles || []);
    const ctrl = [];
    for (let k = 0; k < maxC; k++){
      const c = (r.controles || [])[k];
      if (!c){ ctrl.push("", "", "", "", "", "", "", "", ""); continue; }
      const e = S.evaluaciones.find(x => x.controlId === r.id + ":" + k && x.periodo === S.periodo);
      ctrl.push([c.responsable, c.accion, c.complemento].filter(Boolean).join(" "),
        c.tipo, c.implementacion, pct(Motor.pesoControl(c.tipo, c.implementacion)),
        Motor.afectacion(c.tipo), c.documentacion || "", c.frecuencia || "", c.evidencia || "",
        e ? `${e.calificacion} (${pct(e.total)})` : "");
    }
    const g = S.seguimientos.find(x => x.riesgoId === r.id && x.periodo === S.periodo) || {};
    const m = S.monitoreos.find(x => x.riesgoId === r.id && x.periodo === S.periodo) || {};
    const ci = S.internos.find(x => x.riesgoId === r.id && x.periodo === S.periodo) || {};

    return [r.codigo, macro(proc(r.proceso)?.m)?.n, proc(r.proceso)?.n, uni(r.unidad)?.n,
      tipo(r.tipo)?.n, r.clase || "",
      (r.factores || []).join(" | "), r.descripcion,
      r.causaRaiz || "", r.efectoInmediato || "", r.areaImpacto || r.areaFiscal || "",
      r.activo || "", r.propiedadSD || "",
      r.frecuencia ?? "", pct(r.probabilidadPct || 0), pct(r.impactoPct || 0), r.zonaInherente,
      (r.controles || []).length, ...ctrl,
      res.multP.toFixed(4), res.multI.toFixed(4),
      pct(r.probResidual || 0), pct(r.impResidual || 0), r.zonaResidual,
      r.tratamiento || "", r.subestrategia || "", r.planAccion || "", r.responsablePlan || "",
      r.kri || "", r.fechaPlan || "",
      S.periodo, g.resultado || "", g.actividades || "", g.soporte || "", g.estadoAccion || "",
      m.descripcionConforme || "", m.controlConforme || "", m.controlEficaz || "",
      m.materializo || "", m.instancia || "", m.recomendaciones || "",
      ci.actividades || "", ci.materializo || "", ci.justificacion || "",
      ci.accionesCorrectivas || "", ci.soporteAccion || "",
      r.estado, (r.revisar || []).join(" | ")];
  });
  descargar(`mapa-de-riesgos${sufijoFiltros()}.csv`, aCSV(cab, filas), "text/csv");
}

function exportarResumenCSV(){
  const rs = riesgosFiltrados();
  if (!rs.length) return aviso("Nada que exportar", "No hay riesgos con los filtros aplicados.");
  const ord = {Bajo:1, Moderado:2, Alto:3, Extremo:4};
  const cab = ["Agrupación","Categoría","Riesgos","Bajo","Moderado","Alto","Extremo",
    "Alto o Extremo","% crítico","Bajaron de zona","% reducidos"];
  const filas = [];
  const bloque = (etiqueta, keyFn, nameFn) => {
    agrupar(rs, keyFn, nameFn).forEach(g => {
      const sub = rs.filter(r => nameFn(keyFn(r)) === g.nombre);
      const crit = g.Alto + g.Extremo;
      const baj = sub.filter(r => ord[r.zonaResidual] < ord[r.zonaInherente]).length;
      filas.push([etiqueta, g.nombre, g.total, g.Bajo, g.Moderado, g.Alto, g.Extremo,
        crit, g.total ? Math.round(crit / g.total * 100) + "%" : "0%",
        baj, g.total ? Math.round(baj / g.total * 100) + "%" : "0%"]);
    });
  };
  bloque("Macroproceso", r => proc(r.proceso)?.m, k => macro(k)?.n || k);
  bloque("Proceso", r => r.proceso, k => proc(k)?.n || k);
  bloque("Dependencia", r => r.unidad, k => uni(k)?.n || k);
  bloque("Tipo de riesgo", r => r.tipo, k => tipo(k)?.n || k);
  descargar(`resumen-riesgos${sufijoFiltros()}.csv`, aCSV(cab, filas), "text/csv");
}

function exportarSeguimientoCSV(){
  const cab = ["Periodo","Identificador","Proceso","Dependencia","Indicador (KRI)",

   INFORME COMPLETO PARA PDF
   Arma un documento con portada, filtros aplicados, indicadores,
   gráficas, mapas de calor y el detalle de todos los riesgos en orden.
   Se imprime desde el navegador: no requiere librerías externas.

function filtrosAplicados(){
  const f = S.filtros, out = [];
  if (f.macroproceso) out.push(["Macroproceso", macro(f.macroproceso)?.n]);
  if (f.proceso)      out.push(["Proceso", proc(f.proceso)?.n]);
  if (f.unidad)       out.push(["Dependencia", uni(f.unidad)?.n]);
  if (f.tipo)         out.push(["Tipo de riesgo", tipo(f.tipo)?.n]);
  if (f.zona)         out.push(["Zona residual", f.zona]);
  return out;
}

/* =====================================================================
   MADUREZ DEL SIAR
   Estructura COSO ERM adaptada por Función Pública. Cada punto de reflexión
   se califica de 1 a 5; el principio promedia sus puntos, el componente
   promedia sus principios y el índice general pondera los componentes.
   ===================================================================== */
const claveMad = (d, p, k) => `${d}|${p}|${k}`;

function nivelMadurez(v){
  if (v == null || isNaN(v)) return null;
  return CAT.madurezNiveles.find(x => v <= x.hasta) || CAT.madurezNiveles[0];
}

/* Promedio de los puntos calificados de un principio */
function notaPrincipio(di, pi){
  const pr = CAT.madurez[di].principios[pi];
  const vals = pr.puntos.map((_, k) => S.madurezResp[claveMad(di, pi, k)])
    .filter(v => typeof v === "number");
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function notaComponente(di){
  const vals = CAT.madurez[di].principios.map((_, pi) => notaPrincipio(di, pi))
    .filter(v => v != null);
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

/* Índice general: promedio de los componentes ponderado por su peso */
function indiceMadurez(){
  let suma = 0, peso = 0;
  CAT.madurez.forEach((d, di) => {
    const v = notaComponente(di);
    if (v != null){ suma += v * d.peso; peso += d.peso; }
  });
  return peso ? suma / peso : null;
}

function avanceMadurez(){
  const total = CAT.madurez.reduce((a, d) =>
    a + d.principios.reduce((b, p) => b + p.puntos.length, 0), 0);
  const hechos = Object.values(S.madurezResp).filter(v => typeof v === "number").length;
  return {hechos, total, pct: total ? hechos / total : 0};
}

const num1 = v => v == null ? "—" : v.toFixed(2).replace(/\.?0+$/, "");

async function guardarMadurez(){
  await Store.set("madurez", "actual", {resp:S.madurezResp,
    actualizadoPor:S.sesion?.nombre, actualizadoEn:new Date().toISOString()});
}

/* Gráfico radial de los cinco componentes, en SVG */
function radarMadurez(){
  const pts = CAT.madurez.map((d, di) => ({n:d.n, v:notaComponente(di)}));
  const cx = 150, cy = 140, R = 100, N = pts.length;
  const ang = i => (Math.PI * 2 * i / N) - Math.PI / 2;
  const xy = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];

  let rejilla = "";
  for (let a = 1; a <= 5; a++){
    const d = pts.map((_, i) => xy(i, R * a / 5).join(",")).join(" ");
    rejilla += `<polygon points="${d}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  pts.forEach((_, i) => {
    const [x, y] = xy(i, R);
    rejilla += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
  });

  const conNota = pts.every(p => p.v != null);
  const area = conNota
    ? `<polygon points="${pts.map((p, i) => xy(i, R * p.v / 5).join(",")).join(" ")}"
        fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2"/>`
    : "";
  const marcas = conNota ? pts.map((p, i) => {
    const [x, y] = xy(i, R * p.v / 5);
    return `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`;
  }).join("") : "";

  const etiquetas = pts.map((p, i) => {
    const [x, y] = xy(i, R + 26);
    const anchor = Math.abs(x - cx) < 12 ? "middle" : (x > cx ? "start" : "end");
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="9"
      fill="var(--muted)">${esc(p.n.split(".")[0])}. ${esc(p.n.split(". ")[1]?.slice(0, 18) || "")}</text>
      <text x="${x}" y="${y + 11}" text-anchor="${anchor}" font-size="10" font-weight="600"
      fill="var(--ink)">${num1(p.v)}</text>`;
  }).join("");

  return `<svg viewBox="0 0 300 290" style="width:100%;max-width:330px;height:auto"
    role="img" aria-label="Gráfico radial de madurez por componente">
    ${rejilla}${area}${marcas}${etiquetas}</svg>`;
}

/* =====================================================================
   CICLO SEMESTRAL — SOLICITUDES DE ACTUALIZACIÓN
   Lo que registra el Enlace SIG no entra directo a la matriz: queda como
   solicitud hasta que el administrador la apruebe. Así la matriz general
   siempre refleja lo que SIG validó.
   ===================================================================== */
const OP_SOLICITUD = {
  CREACION:    {n:"Creación",     z:"Bajo"},
  ACTUALIZACION:{n:"Actualización", z:"Moderado"},
  ELIMINACION: {n:"Eliminación",  z:"Extremo"}
};

/* ¿Los cambios de este rol requieren aprobación? */
function requiereAprobacion(){
  return S.sesion?.rol === "ENLACE_SIG";
}

function solicitudPendiente(riesgoId){
  return S.solicitudes.find(x => x.riesgoId === riesgoId && x.estado === "PENDIENTE");
}

async function crearSolicitud(operacion, riesgo, previo, motivo, enlaceRG16){
  const sol = {
    id: uid(),
    operacion,
    riesgoId: riesgo.id,
    codigo: riesgo.codigo || "(nuevo)",
    proceso: riesgo.proceso,
    unidad: riesgo.unidad,
    propuesta: JSON.parse(JSON.stringify(riesgo)),
    anterior: previo ? JSON.parse(JSON.stringify(previo)) : null,
    motivo: motivo || "",
    enlaceRG16: enlaceRG16 || "",
    estado: "PENDIENTE",
    solicitadoPor: S.sesion?.nombre || "—",
    solicitadoEn: new Date().toISOString()
  };
  S.solicitudes.push(sol);
  await Store.set("solicitudes", sol.id, sol);
  return sol;
}

/* Diferencias legibles entre lo vigente y lo propuesto */
function diffSolicitud(sol){
  const campos = {
    descripcion:"Descripción", tipo:"Tipo de riesgo", clase:"Clase de riesgo",
    causaRaiz:"Causa raíz", efectoInmediato:"Efecto inmediato",
    causaInmediata:"Causa inmediata", areaImpacto:"Área de impacto",
    areaIntegridad:"Área de impacto", areaFiscal:"Área de impacto fiscal",
    activo:"Activo de información", vulnerabilidad:"Vulnerabilidad", amenaza:"Amenaza",
    proceso:"Proceso", unidad:"Dependencia", frecuencia:"Frecuencia anual",
    impactoEconomico:"Afectación económica", impactoReputacional:"Afectación reputacional",
    zonaInherente:"Zona inherente", zonaResidual:"Zona residual",
    tratamiento:"Tratamiento", kriNombre:"Indicador"
  };
  const out = [];
  if (!sol.anterior) return out;
  Object.entries(campos).forEach(([k, et]) => {
    const a = sol.anterior[k] ?? "", b = sol.propuesta[k] ?? "";
    if (String(a) !== String(b)) out.push({campo:et, antes:a || "—", ahora:b || "—"});
  });
  const ca = (sol.anterior.controles || []).length, cb = (sol.propuesta.controles || []).length;
  if (ca !== cb) out.push({campo:"Número de controles", antes:ca, ahora:cb});
  return out;
}

async function resolverSolicitud(sol, aprobar, observacion){
  sol.estado = aprobar ? "APROBADA" : "RECHAZADA";
  sol.revisadoPor = S.sesion?.nombre;
  sol.revisadoEn = new Date().toISOString();
  sol.observacion = observacion || "";
  await Store.set("solicitudes", sol.id, sol);

  if (!aprobar) return;

  const ix = S.riesgos.findIndex(r => r.id === sol.riesgoId);
  if (sol.operacion === "ELIMINACION"){
    if (ix >= 0){
      S.riesgos[ix].estado = "OBSOLETO";
      S.riesgos[ix].eliminadoEn = new Date().toISOString();
      S.riesgos[ix].eliminadoPor = sol.solicitadoPor;
      S.riesgos[ix].motivoEliminacion = sol.motivo;
      await Store.set("riesgos", S.riesgos[ix].id, S.riesgos[ix]);
      await registrarVersion(S.riesgos[ix], "ELIMINACION",
        `${sol.motivo} — aprobado por ${S.sesion?.nombre}`, null);
    }
    return;
  }

  const nuevo = JSON.parse(JSON.stringify(sol.propuesta));
  nuevo.aprobadoPor = S.sesion?.nombre;
  nuevo.aprobadoEn = sol.revisadoEn;
  nuevo.enlaceRG16 = sol.enlaceRG16;
  if (ix >= 0) S.riesgos[ix] = nuevo; else S.riesgos.push(nuevo);
  await Store.set("riesgos", nuevo.id, nuevo);
  await registrarVersion(nuevo,
    sol.operacion === "CREACION" ? "CREACION" : "ACTUALIZACION",
    `${sol.motivo} — aprobado por ${S.sesion?.nombre}`, sol.anterior);
}

/* =====================================================================

   Indicador, actividades, soportes y evaluación de los controles.

/* Procesos a cargo de la sesión actual. Vacío o ausente = todos. */
function misProcesos(){
  const p = S.sesion?.procesos;
  return Array.isArray(p) && p.length ? p : null;
}
function misRiesgos(){
  const rs = S.riesgos.filter(r => r.estado !== "OBSOLETO");
  const ps = misProcesos();
  return ps ? rs.filter(r => ps.includes(r.proceso)) : rs;
}
/* Aplica el alcance por proceso sobre los riesgos ya filtrados en pantalla */
function conAlcance(rs){
  const ps = misProcesos();
  return ps ? rs.filter(r => ps.includes(r.proceso)) : rs;
}

function selPeriodo(){
  return `<select id="selPeriodo" autocomplete="off" style="max-width:150px">
    ${periodosConocidos().map(p =>
      `<option value="${p}" ${S.periodo === p ? "selected" : ""}>${p.replace("-", " · ")}</option>`).join("")}
  </select>`;
}

      g.controles = {};
      document.querySelectorAll("[data-ctrl]").forEach(el => {
        const v = el.value.trim(); if (v) g.controles[el.dataset.ctrl] = v;
      });
      /* Descripción de las acciones realizadas de cada actividad del plan */
      g.acciones = {};
      document.querySelectorAll("[data-acc]").forEach(el => {
        const v = el.value.trim(); if (v) g.acciones[el.dataset.acc] = v;
      });

      const nu = document.getElementById("kriNum");
      const de = document.getElementById("kriDen");
      g.kriNumerador = nu ? nu.value : "";
      g.kriDenominador = de ? de.value : "";
      const ev = evaluarKRI(r, g.kriNumerador, g.kriDenominador);
      g.resultado = ev ? ev.texto : "";
      g.resultadoNivel = ev ? ev.nivel : "";
      g.actividades = Object.values(g.acciones).join(" | ");

      g.reportadoPor = S.sesion?.nombre;
      g.reportadoEn = new Date().toISOString();
      g.porAdministracion = esAdmin();

      const ix = S.seguimientos.findIndex(x => x.id === g.id);
      if (ix >= 0) S.seguimientos[ix] = g; else S.seguimientos.push(g);
      await Store.set("seguimientos", g.id, g);
      await registrarMonitoreo(r, g);
      cerrarModal(); render();
    }}
  ] : [{t:"Cerrar", cls:"ghost", fn: cerrarModal}]);

  /* El resultado se recalcula al salir de numerador o denominador */
  ["kriNum","kriDen"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onblur = () => {
      const gg = S.seguimientos.find(x => x.riesgoId === rid && x.periodo === S.periodo) || g;

      document.querySelectorAll("[data-ctrl]").forEach(x => ctr[x.dataset.ctrl] = x.value);
      document.querySelectorAll("[data-acc]").forEach(x => acc[x.dataset.acc] = x.value);
      g.controles = ctr; g.acciones = acc;
      g.kriNumerador = gg.kriNumerador; g.kriDenominador = gg.kriDenominador;
      cerrarModal(); formSeguimiento(rid);
    };
  });
}

/* =====================================================================
   BASE DE DATOS DE MONITOREO
   Una fila por riesgo y periodo con todo lo reportado. Es la fuente del
   informe trimestral y se puede descargar desde el reporte de ejecución.
   ===================================================================== */
async function registrarMonitoreo(r, g){
  const reg = {
    id: `${r.id}-${S.periodo}`,
    periodo: S.periodo,
    codigoRiesgo: r.codigo,
    tipoRiesgo: tipo(r.tipo)?.n || r.tipo,
    macroproceso: macro(proc(r.proceso)?.m)?.n || "",
    proceso: proc(r.proceso)?.n || "",
    dependencia: uni(r.unidad)?.n || "",
    descripcion: r.descripcion,
    inherenteProbabilidad: r.probabilidadPct,
    inherenteImpacto: r.impactoPct,
    inherenteZona: r.zonaInherente,
    residualProbabilidad: r.probResidual,
    residualImpacto: r.impResidual,
    residualZona: r.zonaResidual,
    controles: (r.controles || []).map((c, k) => ({
      n: k + 1,
      descripcion: [c.responsable, c.accion, c.periodicidad, c.complemento].filter(Boolean).join(" "),
      tipo: c.tipo, implementacion: c.implementacion,
      peso: Motor.pesoControl(c.tipo, c.implementacion),
      evidencia: (g.controles || {})[k] || ""
    })),
    kriNombre: r.kriNombre || "",
    kriFormula: r.kri || "",
    kriNumerador: g.kriNumerador ?? "",
    kriDenominador: g.kriDenominador ?? "",
    kriResultado: g.resultado || "",
    kriNivel: g.resultadoNivel || "",
    plan: (r.plan || []).map((a, k) => ({
      n: k + 1, actividad: a.actividad || "", responsable: a.responsable || "",
      fecha: a.fecha || "", acciones: (g.acciones || {})[k] || ""
    })),
    estadoAccion: g.estadoAccion || "",
    reportadoPor: g.reportadoPor || "",
    reportadoEn: g.reportadoEn || new Date().toISOString()
  };
  const ix = S.monitoreoBD.findIndex(x => x.id === reg.id);
  if (ix >= 0) S.monitoreoBD[ix] = reg; else S.monitoreoBD.push(reg);
  await Store.set("monitoreoBD", reg.id, reg);
}

function exportarMonitoreoCSV(){
  const rs = S.monitoreoBD.filter(x => x.periodo === S.periodo);
  if (!rs.length) return aviso("Nada que exportar",
    "Todavía no se ha guardado ningún reporte de ejecución en este periodo.");
  const maxC = Math.max(1, ...rs.map(x => x.controles.length));
  const maxA = Math.max(1, ...rs.map(x => x.plan.length));
  const cab = ["Periodo","Código del riesgo","Tipo de riesgo","Macroproceso","Proceso",
    "Dependencia","Descripción del riesgo",
    "Probabilidad inherente","Impacto inherente","Zona inherente",
    "Probabilidad residual","Impacto residual","Zona residual"];
  for (let k = 1; k <= maxC; k++)
    cab.push(`Control ${k}`, `Tipo ${k}`, `Peso ${k}`, `Descripción de la evidencia ${k}`);
  cab.push("Indicador","Fórmula","Numerador","Denominador","Resultado","Nivel del resultado");
  for (let k = 1; k <= maxA; k++)
    cab.push(`Actividad ${k}`, `Responsable ${k}`, `Fecha ${k}`, `Acciones realizadas ${k}`);
  cab.push("Estado de la acción","Reportado por","Fecha del reporte");

  const filas = rs.map(x => {
    const f = [x.periodo, x.codigoRiesgo, x.tipoRiesgo, x.macroproceso, x.proceso,
      x.dependencia, x.descripcion,
      pct(x.inherenteProbabilidad || 0), pct(x.inherenteImpacto || 0), x.inherenteZona,
      pct(x.residualProbabilidad || 0), pct(x.residualImpacto || 0), x.residualZona];
    for (let k = 0; k < maxC; k++){
      const c = x.controles[k];
      f.push(c ? c.descripcion : "", c ? c.tipo : "", c ? pct(c.peso) : "", c ? c.evidencia : "");
    }
    f.push(x.kriNombre, x.kriFormula, x.kriNumerador, x.kriDenominador, x.kriResultado, x.kriNivel);
    for (let k = 0; k < maxA; k++){
      const a = x.plan[k];
      f.push(a ? a.actividad : "", a ? a.responsable : "", a ? a.fecha : "", a ? a.acciones : "");
    }
    f.push(x.estadoAccion, x.reportadoPor, x.reportadoEn);
    return f;
  });
  descargar(`base-monitoreo-${S.periodo}.csv`, aCSV(cab, filas), "text/csv");
}

function formMonitoreo(rid){
  const r = S.riesgos.find(x => x.id === rid); if (!r) return;
  const abierta = puedeEscribirOperativo("MONITOREO");
  const m = S.monitoreos.find(x => x.riesgoId === rid && x.periodo === S.periodo)
    || {id:uid(), riesgoId:rid, periodo:S.periodo, instancia:"SIG"};
  const rolActual = CAT.roles.find(x => x.c === S.sesion?.rol)?.n || "";
  const pregunta = (id, etiqueta, val, ayuda) => `<div class="field">
    <label>${etiqueta}</label>
    <select id="${id}" ${abierta ? "" : "disabled"} autocomplete="off">
      <option value="">Seleccione</option>
      ${CAT.siNo.map(x => `<option ${val === x ? "selected" : ""}>${x}</option>`).join("")}
    </select>${ayuda ? `<p class="hint">${ayuda}</p>` : ""}</div>`;

  modal(`Monitoreo · ${r.codigo}`, `
    <p style="margin:0 0 6px;font-size:13px">${esc(r.descripcion)}</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px">
      <span class="tag">${esc(proc(r.proceso)?.n)}</span>
      <span class="zone ${r.zonaResidual}">${esc(r.zonaResidual || "")}</span>
      <span class="tag">${(r.controles || []).length} controles</span></div>

    ${pregunta("moDesc", "¿La descripción del riesgo se ajusta a los lineamientos de la política?",
      m.descripcionConforme,
      "Verifique que inicie con «Posibilidad de» y contenga impacto, causa inmediata y causa raíz.")}
    ${pregunta("moCtrl", "¿La descripción del control se ajusta a los lineamientos de la política?",
      m.controlConforme,
      "Cada control debe tener responsable, acción y complemento, con periodicidad explícita.")}
    ${pregunta("moEfic", "¿El control ha sido eficaz?", m.controlEficaz,
      "Contraste con el resultado del indicador y los soportes aportados por la dependencia.")}
    ${pregunta("moMat", "¿El riesgo se materializó en el periodo evaluado?", m.materializo,
      "Si responde Sí, debe existir una acción correctiva formulada en el formato ES-SIG-RG-02.")}

    <div class="field"><label>Instancia que monitorea</label>
      <select id="moInst" ${abierta ? "" : "disabled"} autocomplete="off">
        ${CAT.instancias.map(x => `<option ${m.instancia === x ? "selected" : ""}>${x}</option>`).join("")}
      </select>
      <p class="hint">Registrando como <b>${esc(rolActual)}</b>.
        Este concepto es independiente de lo que reportó la dependencia: esa separación es lo que
        le da validez. Cada instancia guarda el suyo por separado.</p></div>

    <div class="field"><label>Estado de la acción</label>
      <select id="moEst" ${abierta ? "" : "disabled"} autocomplete="off">
        <option value="">Seleccione</option>
        ${CAT.estadoAccion.map(x => `<option ${(S.seguimientos.find(y =>
          y.riesgoId === rid && y.periodo === S.periodo)?.estadoAccion) === x
          ? "selected" : ""}>${x}</option>`).join("")}
      </select>
      <p class="hint">Determine el avance del plan de acción a partir de lo reportado por la
        dependencia. Es el único rol que fija este estado.</p></div>

    <div class="field"><label>Recomendaciones</label>
      <textarea id="moRec" ${abierta ? "" : "disabled"}
        placeholder="Qué debe ajustar la dependencia">${esc(m.recomendaciones || "")}</textarea></div>

    ${(() => { const g = S.seguimientos.find(x => x.riesgoId === rid && x.periodo === S.periodo);
      return g ? `<div class="calc"><b style="font-size:12px">Lo reportado por la dependencia</b>
        <div class="calc-row"><span>Resultado del indicador</span><span class="mono">${esc(g.resultado || "—")}</span></div>
        <div class="calc-row"><span>Controles con evidencia descrita</span>
          <span class="mono">${Object.keys(g.controles || {}).length} de ${(r.controles || []).length}</span></div>
        <div class="calc-row"><span>Actividades reportadas</span>

          ${esc(r.planAccion)}</div>` : ""}

      const ix = S.monitoreos.findIndex(x => x.id === m.id);
      if (ix >= 0) S.monitoreos[ix] = m; else S.monitoreos.push(m);
      await Store.set("monitoreos", m.id, m);
      cerrarModal(); render();
    }}
  ] : [{t:"Cerrar", cls:"ghost", fn: cerrarModal}]);
}

function vistaInterno(){
