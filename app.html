  const discrepa = r => {
    const m = S.monitoreos.find(x => x.riesgoId === r.id && x.periodo === S.periodo);
    const c = ci(r.id);
    return m?.materializo && c.materializo && m.materializo !== c.materializo;
  };
  const enDisputa = rs.filter(discrepa);

  return bannerAdmin() + barrasFiltros() + `<div class="stack" style="margin-top:16px">
    ${enDisputa.length ? `<div class="banner warn"><span>&#9888;</span><div>
      <b>${enDisputa.length} riesgos con criterio discrepante.</b> Control Interno y la Dirección SIG
      responden distinto sobre la materialización: ${enDisputa.map(r => esc(r.codigo)).join(", ")}.
      Requieren conciliación con acta.</div></div>` : ""}

    <div class="card">
      <header><div style="display:flex;gap:10px;align-items:center">
        <h2>Seguimiento de Control Interno</h2>${selPeriodo()}</div>
        <span class="tag">${rs.filter(r => ci(r.id).revisado).length} de ${rs.length}</span></header>
      ${!abierta ? `<div class="body" style="padding-bottom:0"><div class="banner warn">
        <span>&#9888;</span><div>La ventana de seguimiento está cerrada.</div></div></div>` : ""}
      ${rs.length ? `<div class="scroll-x"><table class="fija" style="min-width:1140px">
        <colgroup><col style="width:160px"><col style="width:360px"><col style="width:230px">
          <col style="width:110px"><col style="width:200px"><col style="width:90px"></colgroup>
        <thead><tr>
        <th>Identificador</th><th>Riesgo</th><th>Actividades verificadas</th>
        <th class="ctr">Se materializó</th><th>Acción correctiva</th><th></th>
      </tr></thead><tbody>${rs.map(r => { const c = ci(r.id); return `<tr>
        <td class="rid">${esc(r.codigo)}${discrepa(r) ? ` <span class="zone Extremo">Discrepa</span>` : ""}</td>
        <td><div class="just">${esc(r.descripcion)}</div></td>
        <td class="hint just">${esc(c.actividades || "")}</td>
        <td class="ctr">${c.materializo === "Si" ? `<span class="zone Extremo">Sí</span>`
          : c.materializo === "No" ? `<span class="zone Bajo">No</span>` : "—"}</td>
        <td class="hint just">${esc(c.accionesCorrectivas || "")}</td>
        <td><button class="btn ${c.revisado ? "ghost" : ""} sm" data-int="${r.id}">
          ${abierta ? "Registrar" : "Ver"}</button></td>
      </tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty"><b>Sin riesgos</b> No hay riesgos con los filtros aplicados.</div>`}
    </div>
  </div>`;
}

function formInterno(rid){
  const r = S.riesgos.find(x => x.id === rid); if (!r) return;
  const abierta = puedeEscribirOperativo("SEGUIMIENTO");
  const c = S.internos.find(x => x.riesgoId === rid && x.periodo === S.periodo)
    || {id:uid(), riesgoId:rid, periodo:S.periodo};
  const m = S.monitoreos.find(x => x.riesgoId === rid && x.periodo === S.periodo);
  const ruta = rutaEvidencia(r, S.periodo, c.soporteAccion || "ES-SIG-RG-02.pdf");

  modal(`Control Interno · ${r.codigo}`, `
    <p style="margin:0 0 15px;font-size:13px">${esc(r.descripcion)}</p>

    <div class="field"><label>Descripción de las actividades realizadas para la ejecución del control</label>
      <textarea id="ciAct" ${abierta ? "" : "disabled"}
        placeholder="Describa brevemente las actividades realizadas y los soportes aportados">${esc(c.actividades || "")}</textarea></div>

    <div class="field"><label>Según su criterio, durante el periodo evaluado ¿se materializó el riesgo?</label>
      <select id="ciMat" ${abierta ? "" : "disabled"} autocomplete="off">
        <option value="">Seleccione</option>
        ${CAT.siNo.map(x => `<option ${c.materializo === x ? "selected" : ""}>${x}</option>`).join("")}
      </select>
      ${m?.materializo ? `<p class="hint">La Dirección SIG respondió <b>${esc(m.materializo)}</b>.
        Si su criterio difiere, la discrepancia queda registrada y requiere conciliación.</p>` : ""}</div>

    <div class="field"><label>Justifique brevemente por qué considera que se materializó el riesgo</label>
      <textarea id="ciJus" ${abierta ? "" : "disabled"}
        placeholder="En caso de no haberse materializado, escriba No Aplica">${esc(c.justificacion || "")}</textarea></div>

    <div class="field"><label>¿Qué acciones correctivas se realizaron ante la materialización del riesgo?</label>
      <textarea id="ciAcc" ${abierta ? "" : "disabled"}
        placeholder="En caso que no se haya materializado escriba No Aplica">${esc(c.accionesCorrectivas || "")}</textarea></div>

    <div class="field"><label>Soporte de formulación de la acción correctiva</label>
      <input type="text" id="ciSop" value="${esc(c.soporteAccion || "")}" ${abierta ? "" : "disabled"}
        placeholder="ES-SIG-RG-02.pdf">
      <div class="banner info" style="margin-top:7px"><span>&#9432;</span><div>
        Cargue el formato ES-SIG-RG-02. Se guardará en Drive como<br>
        <b class="mono">${esc(ruta.carpeta)}/${esc(ruta.archivo)}</b></div></div></div>
  `, abierta ? [
    {t:"Cancelar", cls:"ghost", fn: cerrarModal},
    {t:"Guardar", cls:"", fn: async () => {
      c.actividades = document.getElementById("ciAct").value.trim();
      c.materializo = document.getElementById("ciMat").value;
      c.justificacion = document.getElementById("ciJus").value.trim();
      c.accionesCorrectivas = document.getElementById("ciAcc").value.trim();
      c.soporteAccion = document.getElementById("ciSop").value.trim();
      if (c.materializo === "Si" && !c.accionesCorrectivas)
        return aviso("Falta la acción correctiva",
          "Si el riesgo se materializó debe registrar qué acciones correctivas se realizaron.");
      c.revisado = true; c.evaluadoPor = S.sesion?.nombre;
      c.porAdministracion = esAdmin();
      c.evaluadoEn = new Date().toISOString();
      const ix = S.internos.findIndex(x => x.id === c.id);
      if (ix >= 0) S.internos[ix] = c; else S.internos.push(c);
      await Store.set("internos", c.id, c);
      cerrarModal(); render();
    }}
  ] : [{t:"Cerrar", cls:"ghost", fn: cerrarModal}]);
}

/* =====================================================================
   PERFILES POR PROCESO
   ===================================================================== */
function vistaPerfiles(){
  const ROLES = ["ENLACE_SIG","MONITOREO","SEGUIMIENTO"];
  const conRol = (pc, rol) => S.usuarios.filter(u =>
    u.activo !== false && u.rol === rol && (u.procesos || []).includes(pc));

  const filas = CAT.macroprocesos.flatMap(m =>
    CAT.procesos.filter(p => p.m === m.c).map((p, i) => {
      const nr = S.riesgos.filter(r => r.proceso === p.c && r.estado !== "OBSOLETO").length;
      return `<tr>
        <td>${i === 0 ? `<b style="font-weight:500">${esc(m.n)}</b>` : ""}</td>
        <td><div class="just">${esc(p.n)}</div>
          <div class="hint">${nr} ${nr === 1 ? "riesgo" : "riesgos"}</div></td>
        ${ROLES.map(rol => {
          const us = conRol(p.c, rol);
          return `<td>${us.length
            ? us.map(u => `<div>${esc(u.nombre)}</div>`).join("")
            : `<span class="zone ${nr ? "Alto" : "Moderado"}">Sin asignar</span>`}</td>`;
        }).join("")}
      </tr>`;
    })).join("");

  const sinCobertura = CAT.procesos.filter(p =>
    S.riesgos.some(r => r.proceso === p.c && r.estado !== "OBSOLETO") &&
    ROLES.some(rol => !conRol(p.c, rol).length));

  return `<div class="stack">
    <div class="banner info"><span>&#9432;</span><div>Esta tabla muestra quién responde por cada
      proceso en el ciclo de gestión del riesgo. Es información pública: cualquier persona puede
      consultarla sin iniciar sesión.</div></div>

    ${sinCobertura.length ? `<div class="banner warn"><span>&#9888;</span><div>
      <b>${sinCobertura.length} procesos con riesgos registrados no tienen todos los roles asignados.</b>
      Mientras falte un responsable, esa etapa del ciclo trimestral no se puede cumplir.</div></div>` : ""}

    <div class="card">
      <header><h2>Responsables por proceso</h2>
        <button class="btn ghost sm" id="expPerfiles">Exportar</button></header>
      <div class="scroll-x"><table class="fija" style="min-width:1020px">
        <colgroup><col style="width:130px"><col style="width:270px"><col style="width:206px">
          <col style="width:206px"><col style="width:206px"></colgroup>
        <thead><tr>
          <th>Macroproceso</th><th>Proceso</th>
          <th>Enlace SIG</th><th>Monitoreo calidad</th><th>Control Interno</th>
        </tr></thead><tbody>${filas}</tbody></table></div>
    </div>
  </div>`;
}

function modal(titulo, cuerpo, botones){
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">
    <header><h2>${esc(titulo)}</h2><button class="x" id="mX" aria-label="Cerrar">×</button></header>
    <div class="body">${cuerpo}</div>
    <footer>${botones.map((b, i) =>
      `<button class="btn ${b.cls}" data-mb="${i}">${esc(b.t)}</button>`).join("")}</footer>
  </div></div>`;
  host.querySelector("#mX").onclick = cerrarModal;
  host.querySelectorAll("[data-mb]").forEach(b =>
    b.onclick = () => botones[Number(b.dataset.mb)].fn());
  host.querySelector(".modal-bg").onclick = e => { if (e.target.classList.contains("modal-bg")) cerrarModal(); };
}
function cerrarModal(){ document.getElementById("modalHost").innerHTML = ""; }
function aviso(t, m){
  const host = document.getElementById("modalHost");
  const prev = host.innerHTML;
  host.innerHTML = `<div class="modal-bg" style="z-index:110"><div class="modal" style="max-width:420px">
    <header><h2>${esc(t)}</h2></header><div class="body"><p style="margin:0">${esc(m)}</p></div>
    <footer><button class="btn" id="aOk">Entendido</button></footer></div></div>`;
  document.getElementById("aOk").onclick = () => { host.innerHTML = prev; reenlazar(); };
}
function reenlazar(){ if (F) enlazarFormulario(); }

   ===================================================================== */
function elegirSesion(){
  const opciones = [
    {nombre:"Administrador", rol:"ADMIN", procesos:[]},
    ...S.usuarios.filter(u => u.activo !== false).map(u =>
      ({nombre:u.nombre, rol:u.rol, procesos:u.procesos || []})),
    {nombre:"Visitante", rol:"PUBLICO", procesos:[]}
  ];
  modal("Entrar como", `
    <p class="hint" style="margin:0 0 13px">Este prototipo no pide contraseña: sirve para probar
    qué ve y qué puede hacer cada rol. La autenticación real va en el servidor.</p>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${opciones.map((o, i) => {
        const r = CAT.roles.find(x => x.c === o.rol);
        return `<button class="btn ghost" data-sesion="${i}"
          style="justify-content:flex-start;text-align:left;padding:10px 13px;flex-direction:column;align-items:flex-start;gap:2px">
          <b style="font-weight:500">${esc(o.nombre)}</b>
          <span class="hint">${esc(r?.n || o.rol)}${(o.procesos || []).length
            ? " · " + o.procesos.length + " procesos" : ""}</span>
        </button>`;
      }).join("")}
    </div>
  `, []);
  document.querySelectorAll("[data-sesion]").forEach(b => b.onclick = () => {
    S.sesion = opciones[Number(b.dataset.sesion)];
    S.intervencion = false;
    if (!VISTAS.find(v => v.id === S.vista && (!v.soloAdmin || S.sesion.rol === "ADMIN")))
      S.vista = "panel";
    cerrarModal(); render();
  });
}

   RENDER PRINCIPAL

function render(){
  pintarNav();
  const v = VISTAS.find(x => x.id === S.vista) || VISTAS[0];
  document.getElementById("vTitle").textContent = v.n;

  const subs = {
    madurez:"Autodiagnóstico del Sistema Integral de Administración del Riesgo",
    solicitudes:"Creación, actualización y eliminación pendientes de aprobación",
    seguimiento:"Cuatro veces al año: indicador, actividades, soportes y evaluación de controles",
    monitoreo:"Revisión de la Dirección SIG sobre la calidad de riesgos y controles",
    interno:"Verificación independiente y contraste con el monitoreo de SIG",
    perfiles:"Quién responde por cada proceso en el ciclo de gestión del riesgo",
    panel:"Distribución de los riesgos vigentes",
    riesgos:"Inventario completo por proceso y dependencia",
    matriz:"Ubicación de los riesgos antes y después de los controles",
    historico:"Cada cambio queda registrado de forma permanente",
    usuarios:"Creación y administración de cuentas",
    ventanas:"Cuándo se puede actualizar, monitorear y hacer seguimiento",

  if (S.vista === "riesgos")
    acc.innerHTML = (puede("riesgo") ? `<button class="btn" id="btnNuevo">Registrar riesgo</button>` : "")
      + (puedeDescargar("XLS") ? `<button class="btn ghost" id="btnXlsCtrl">Controles</button>` : "")
      + exportar;
  if (S.vista === "panel" || S.vista === "matriz") acc.innerHTML = exportar;
  if (S.vista === "solicitudes" && puedeDescargar("XLS"))
    acc.innerHTML = `<button class="btn ghost" id="btnSolCsv">Exportar solicitudes</button>`;
  if (S.vista === "seguimiento")
    acc.innerHTML = (puedeDescargar("XLS")
      ? `<button class="btn ghost" id="btnBD">Base de monitoreo</button>` : "") + exportar;
  if (S.vista === "usuarios")
    acc.innerHTML = `<button class="btn" id="btnNuevoU">Nuevo usuario</button>`;

    madurez: vistaMadurez,
    solicitudes: vistaSolicitudes,
    panel: vistaPanel, riesgos: vistaRiesgos, matriz: vistaMatriz,
    historico: vistaHistorico, usuarios: vistaUsuarios,
    ventanas: vistaVentanas, metodo: vistaMetodo,
    seguimiento: vistaSeguimiento, monitoreo: vistaMonitoreo,
    interno: vistaInterno, perfiles: vistaPerfiles
  }[v.id] || vistaPanel;
  document.getElementById("view").innerHTML = cuerpo();

  enlazarFiltros();
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
  on("btnInterv", () => { S.intervencion = !S.intervencion; render(); });
  on("cfgDriveSave", () => {
    setDriveURL(document.getElementById("cfgDrive").value.trim()); render();
  });
  on("cfgDriveTest", async () => {
    const m = document.getElementById("cfgDriveMsg");
    m.textContent = "Probando…";
    try {
      const res = await fetch(driveURL(), {method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({ping:true})});
      const d = await res.json();
      m.textContent = d.ok ? `Conexión correcta. Carpeta raíz: ${d.carpeta || "Riesgos"}`
        : `Respondió con error: ${d.error || "desconocido"}`;
    } catch(e){ m.textContent = "No respondió: " + e.message; }
  });
  on("btnSemilla", () => recargarSemilla());
  on("btnNuevo", () => abrirFormulario(null));
  on("btnXlsCtrl", () => exportarControlesCSV());
  on("btnBD", () => exportarMonitoreoCSV());
  on("btnSolCsv", () => {
    const lista = esAdmin() ? S.solicitudes
      : S.solicitudes.filter(x => x.solicitadoPor === S.sesion?.nombre);
    if (!lista.length) return aviso("Nada que exportar", "No hay solicitudes registradas.");
    const cab = ["Operación","Identificador","Proceso","Dependencia","Descripción propuesta",
      "Motivo","Formato ES-SIG-RG-16","Campos modificados","Solicitado por","Fecha de solicitud",
      "Estado","Revisado por","Fecha de revisión","Observación de la revisión"];
    const filas = lista.map(x => [OP_SOLICITUD[x.operacion].n, x.codigo,
      proc(x.proceso)?.n || "", uni(x.unidad)?.n || "", x.propuesta.descripcion || "",
      x.motivo, x.enlaceRG16,
      diffSolicitud(x).map(d => `${d.campo}: ${d.antes} → ${d.ahora}`).join(" | "),
      x.solicitadoPor, x.solicitadoEn, x.estado, x.revisadoPor || "",
      x.revisadoEn || "", x.observacion || ""]);
    descargar("solicitudes-actualizacion.csv", aCSV(cab, filas), "text/csv");
  });
  on("btnXls", () => {
    if (S.vista === "riesgos") exportarRiesgosCSV();
    else if (S.vista === "seguimiento") exportarSeguimientoCSV();
    else exportarResumenCSV();
  });
  on("btnPdf", () => exportarPDF());
  on("expPerfiles", () => {
    const ROLES = [["ENLACE_SIG","Enlace SIG"],["MONITOREO","Monitoreo calidad"],
                   ["SEGUIMIENTO","Control Interno"]];
    const cab = ["Macroproceso","Proceso","Riesgos", ...ROLES.map(r => r[1])];
    const filas = CAT.macroprocesos.flatMap(m => CAT.procesos.filter(pp => pp.m === m.c).map(pp => [
      m.n, pp.n,
      S.riesgos.filter(r => r.proceso === pp.c && r.estado !== "OBSOLETO").length,
      ...ROLES.map(([rc]) => S.usuarios.filter(u => u.activo !== false && u.rol === rc
        && (u.procesos || []).includes(pp.c)).map(u => u.nombre).join(", "))]));
    descargar("responsables-por-proceso.csv", aCSV(cab, filas), "text/csv");
  });

  const sp = document.getElementById("selPeriodo");
  if (sp) sp.onchange = () => { S.periodo = sp.value; render(); };
  document.querySelectorAll("[data-maddim]").forEach(b =>
    b.onclick = () => { S.madurezDim = Number(b.dataset.maddim); render(); });
  on("madVolver", () => { S.madurezDim = null; render(); });
  document.querySelectorAll("[data-mad]").forEach(el => el.onchange = async () => {
    if (el.value) S.madurezResp[el.dataset.mad] = Number(el.value);
    else delete S.madurezResp[el.dataset.mad];
    await guardarMadurez(); render();
  });
  on("madCsv", () => {
    const cab = ["Componente","Peso","Nota del componente","Nivel del componente",
      "Principio","Nota del principio","Nivel del principio",
      "N.º","Punto de reflexión","Calificación","Grado de madurez"];
    const filas = [];
    CAT.madurez.forEach((d, di) => {
      const vc = notaComponente(di), nvc = nivelMadurez(vc);
      d.principios.forEach((pr, pi) => {
        const vp = notaPrincipio(di, pi), nvp = nivelMadurez(vp);
        pr.puntos.forEach((pt, k) => {
          const v = S.madurezResp[claveMad(di, pi, k)];
          const g = CAT.madurezGrados.find(x => x.v === v);
          filas.push([d.n, (d.peso * 100).toFixed(0) + "%", num1(vc), nvc ? nvc.n : "",
            pr.n, num1(vp), nvp ? nvp.n : "", k + 1, pt, v ?? "", g ? g.n : ""]);
        });
      });
    });
    const ind = indiceMadurez(), niv = nivelMadurez(ind);
    filas.push(["Madurez del Sistema Integral de Administración del Riesgo", "100%",
      num1(ind), niv ? niv.n : "", "", "", "", "", "", "", ""]);
    descargar("madurez-siar.csv", aCSV(cab, filas), "text/csv");
  });
  document.querySelectorAll("[data-sol]").forEach(b =>
    b.onclick = () => verSolicitud(b.dataset.sol, true));
  document.querySelectorAll("[data-solver]").forEach(b =>
    b.onclick = () => verSolicitud(b.dataset.solver, false));
  document.querySelectorAll("[data-seg]").forEach(b => b.onclick = () => formSeguimiento(b.dataset.seg));
  document.querySelectorAll("[data-mon]").forEach(b => b.onclick = () => formMonitoreo(b.dataset.mon));
  document.querySelectorAll("[data-int]").forEach(b => b.onclick = () => formInterno(b.dataset.int));
  on("btnNuevoU", () => formUsuario(null));

  document.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => verRiesgo(b.dataset.ver));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => abrirFormulario(b.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => eliminarRiesgo(b.dataset.del));
  document.querySelectorAll("[data-uedit]").forEach(b => b.onclick = () => formUsuario(b.dataset.uedit));
  document.querySelectorAll("[data-udel]").forEach(b => b.onclick = async () => {
    const u = S.usuarios.find(x => x.id === b.dataset.udel);
    modal("Eliminar usuario", `<p style="margin:0">Se eliminará la cuenta de <b>${esc(u.nombre)}</b>.
      Su rastro en el histórico de riesgos se conserva, pero perderá el acceso.</p>
      <p class="hint" style="margin-top:9px">Si solo quieres suspenderlo temporalmente, edítalo y márcalo como inactivo.</p>`,
      [{t:"Cancelar", cls:"ghost", fn:cerrarModal},
       {t:"Eliminar", cls:"danger", fn: async () => {
         S.usuarios = S.usuarios.filter(x => x.id !== u.id);
         await Store.del("usuarios", u.id); cerrarModal(); render();
       }}]);
  });
  document.querySelectorAll("[data-ureset]").forEach(b => b.onclick = () => {
    const u = S.usuarios.find(x => x.id === b.dataset.ureset);
    u.requiereCambio = true; Store.set("usuarios", u.id, u);
    mostrarClave(u, generarClave());
  });
  document.querySelectorAll("[data-newv]").forEach(b => b.onclick = () => formVentana(b.dataset.newv));
  document.querySelectorAll("[data-delv]").forEach(b => b.onclick = async () => {
    S.ventanas = S.ventanas.filter(v => v.id !== b.dataset.delv);
    await Store.del("ventanas", b.dataset.delv); render();
  });
  document.querySelectorAll("[data-restore]").forEach(b => b.onclick = async () => {
    const r = S.riesgos.find(x => x.id === b.dataset.restore);
    r.estado = "VIGENTE"; delete r.eliminadoEn; delete r.eliminadoPor;
    await Store.set("riesgos", r.id, r);
    await registrarVersion(r, "RESTAURACION", "Riesgo restaurado por el administrador", null);
    render();
  });
}

async function cargarSemilla(){
  const url = new URL("datos.json?v=" + Date.now(), location.href).href;
  let r;
  try { r = await fetch(url, {cache:"no-store"}); }
  catch(e){
    S.semilla = {estado:"error", detalle:
      "No se pudo pedir el archivo (" + e.message + "). Si abriste index.html con doble clic "
      + "desde tu computador, el navegador bloquea la lectura de archivos locales: "
      + "debe servirse desde GitHub Pages."};
    return 0;
  }
  if (!r.ok){
    S.semilla = {estado:"error", detalle:
      "El servidor respondió " + r.status + " al pedir " + url
      + ". Verifica que datos.json esté en la raíz del repositorio, junto a index.html."};
    return 0;
  }
  let d;
  try { d = await r.json(); }
  catch(e){
    S.semilla = {estado:"error", detalle:
      "El archivo se descargó pero no es JSON válido. Vuelve a subir datos.json."};
    return 0;
  }
  const lista = d.riesgos || [];
  if (!lista.length){
    S.semilla = {estado:"error", detalle:"datos.json no contiene riesgos."};
    return 0;
  }
  try {
    lista.forEach(x => {
      x.codigo = x.codigoOriginal || x.id;
      x.frecuencia = x.frecuencia ?? "";
      S.riesgos.push(x);
    });
    /* Una sola escritura en lugar de 235 */
    Store.local.riesgos = Object.fromEntries(lista.map(x => [x.id, x]));
    Store.flush();
    if (Store.db) for (const x of lista) await Store.set("riesgos", x.id, x);
  } catch(e){
    S.semilla = {estado:"error", detalle:
      "Los riesgos se leyeron pero no se pudieron guardar: " + e.message
      + ". Si dice QuotaExceeded, el almacenamiento del navegador está lleno."};
    return lista.length;
  }
  S.semilla = {estado:"ok", detalle: lista.length + " riesgos cargados"};
  return lista.length;
}

async function recargarSemilla(){
  S.riesgos = []; Store.local.riesgos = {}; Store.flush();
  await cargarSemilla(); render();
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async function(){
  await Store.init();
  S.riesgos   = await Store.get("riesgos");
  if (!S.riesgos.length) await cargarSemilla();
  S.usuarios  = await Store.get("usuarios");
  S.ventanas  = await Store.get("ventanas");
  S.historico = await Store.get("historico");
  S.seguimientos = await Store.get("seguimientos");
  S.monitoreos   = await Store.get("monitoreos");
  S.internos     = await Store.get("internos");
  S.evaluaciones = await Store.get("evaluaciones");
  S.monitoreoBD  = await Store.get("monitoreoBD");
  S.solicitudes  = await Store.get("solicitudes");
  const md = await Store.get("madurez");
  S.madurezResp = (md[0] && md[0].resp) || {};
  S.periodo = periodoActual();
  /* Con un único proceso a cargo, el filtro arranca fijado en él */
  const mp = misProcesos();
  if (mp && mp.length === 1) S.filtros.proceso = mp[0];
  S.sesion = {nombre:"Administrador", rol:"ADMIN", procesos:[]};
  render();
})();
</script>
